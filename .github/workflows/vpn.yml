name: Update Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  update-workers:
    runs-on: windows-latest

    steps:

      # ==========================================================
      # UPDATE VMESS + TROJAN WORKERS
      # ==========================================================

      - name: Update 2 Workers (VMess + Trojan)
        shell: pwsh
        env:
          VMESS_TOKEN: ${{ secrets.CF_TOKEN_VMESS }}
          TROJAN_TOKEN: ${{ secrets.CF_TOKEN_TROJAN }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}

        run: |

          $ErrorActionPreference = "Stop"

          # ======================================================
          # CONFIG
          # ======================================================

          $vmessAccountId = "e96a2dd0c1de68077e282bab0f5e64af"
          $vmessWorkerName = "my-vpn-worker"

          $trojanAccountId = "1d7e90e6cc00cc6ca5494f61cdd3e92d"
          $trojanWorkerName = "little-frost-5a54"

          $vmessOut = "C:\Xray\cf_out_2053.txt"
          $vmessErr = "C:\Xray\cf_err_2053.txt"

          $trojanOut = "C:\Xray\cf_out_2083.txt"
          $trojanErr = "C:\Xray\cf_err_2083.txt"


          # ======================================================
          # FUNCTION: READ LOG
          # ======================================================

          function Get-TunnelLog {
              param (
                  [string]$OutFile,
                  [string]$ErrFile
              )

              $parts = @()

              if (Test-Path $OutFile) {
                  $parts += Get-Content $OutFile -Raw -ErrorAction SilentlyContinue
              }

              if (Test-Path $ErrFile) {
                  $parts += Get-Content $ErrFile -Raw -ErrorAction SilentlyContinue
              }

              return ($parts -join "`n")
          }


          # ======================================================
          # FUNCTION: FIND CLOUDFLARE URL
          # ======================================================

          function Wait-ForCloudflareUrl {
              param (
                  [string]$OutFile,
                  [string]$ErrFile,
                  [string]$Name,
                  [int]$TimeoutSeconds = 60
              )

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "Searching Cloudflare URL: $Name"
              Write-Host "=========================================="

              $url = $null

              $patterns = @(
                  'https://[a-zA-Z0-9-]+\.trycloudflare\.com',
                  'https://[a-zA-Z0-9-]+\.trycloudflare\.com:[0-9]+'
              )

              for ($i = 0; $i -lt $TimeoutSeconds; $i++) {

                  $log = Get-TunnelLog `
                      -OutFile $OutFile `
                      -ErrFile $ErrFile

                  foreach ($pattern in $patterns) {

                      $match = [regex]::Match(
                          $log,
                          $pattern,
                          [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
                      )

                      if ($match.Success) {
                          $url = $match.Value
                          break
                      }
                  }

                  if ($url) {
                      break
                  }

                  Write-Host "[$($i + 1)/$TimeoutSeconds] URL not found yet..."

                  Start-Sleep -Seconds 1
              }

              if (-not $url) {

                  Write-Host ""
                  Write-Host "=========================================="
                  Write-Host "$Name LOG"
                  Write-Host "=========================================="

                  $finalLog = Get-TunnelLog `
                      -OutFile $OutFile `
                      -ErrFile $ErrFile

                  if ($finalLog) {
                      Write-Host $finalLog
                  }
                  else {
                      Write-Host "LOG IS EMPTY."
                      Write-Host "Output file: $OutFile"
                      Write-Host "Error file : $ErrFile"
                  }

                  Write-Host ""
                  throw "$Name Cloudflare URL not found after $TimeoutSeconds seconds."
              }

              Write-Host ""
              Write-Host "Cloudflare URL found:"
              Write-Host $url

              return $url
          }


          # ======================================================
          # FUNCTION: UPDATE CLOUDFLARE WORKER
          # ======================================================

          function Update-Worker {
              param (
                  [string]$AccountId,
                  [string]$WorkerName,
                  [string]$Token,
                  [string]$TargetUrl,
                  [string]$WorkerType
              )

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "Updating $WorkerType Worker"
              Write-Host "=========================================="

              Write-Host "Target:"
              Write-Host $TargetUrl

              $code = @"
          addEventListener('fetch', event => {
            event.respondWith(handleRequest(event.request))
          });

          async function handleRequest(request) {
            const url = new URL(request.url);
            const targetUrl = '$TargetUrl';
            const newUrl = targetUrl + url.pathname + url.search;

            return fetch(new Request(newUrl, {
              method: request.method,
              headers: request.headers,
              body: request.body
            }));
          }
          "@

              $fileName = if ($WorkerType -eq "VMess") {
                  "C:\Xray\worker-vmess.js"
              }
              else {
                  "C:\Xray\worker-trojan.js"
              }

              Set-Content `
                  -Path $fileName `
                  -Value $code `
                  -Encoding UTF8

              $headers = @{
                  Authorization = "Bearer $Token"
                  "Content-Type" = "application/javascript"
              }

              $body = Get-Content `
                  $fileName `
                  -Raw

              $uri = "https://api.cloudflare.com/client/v4/accounts/$AccountId/workers/scripts/$WorkerName"

              try {

                  $response = Invoke-RestMethod `
                      -Uri $uri `
                      -Method Put `
                      -Headers $headers `
                      -Body $body

                  Write-Host ""
                  Write-Host "$WorkerType Worker updated successfully."

              }
              catch {

                  Write-Host ""
                  Write-Host "ERROR updating $WorkerType Worker:"
                  Write-Host $_

                  throw
              }
          }


          # ======================================================
          # VMESS
          # ======================================================

          $vmessToken = $env:VMESS_TOKEN

          if ([string]::IsNullOrWhiteSpace($vmessToken)) {
              throw "CF_TOKEN_VMESS secret is empty or missing."
          }

          $urlVmess = Wait-ForCloudflareUrl `
              -OutFile $vmessOut `
              -ErrFile $vmessErr `
              -Name "VMess" `
              -TimeoutSeconds 60

          Update-Worker `
              -AccountId $vmessAccountId `
              -WorkerName $vmessWorkerName `
              -Token $vmessToken `
              -TargetUrl $urlVmess `
              -WorkerType "VMess"


          # ======================================================
          # TROJAN
          # ======================================================

          $trojanToken = $env:TROJAN_TOKEN

          if ([string]::IsNullOrWhiteSpace($trojanToken)) {
              throw "CF_TOKEN_TROJAN secret is empty or missing."
          }

          $urlTrojan = Wait-ForCloudflareUrl `
              -OutFile $trojanOut `
              -ErrFile $trojanErr `
              -Name "Trojan" `
              -TimeoutSeconds 60

          Update-Worker `
              -AccountId $trojanAccountId `
              -WorkerName $trojanWorkerName `
              -Token $trojanToken `
              -TargetUrl $urlTrojan `
              -WorkerType "Trojan"


          # ======================================================
          # DONE
          # ======================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "BOTH WORKERS UPDATED SUCCESSFULLY"
          Write-Host "=========================================="

          Write-Host "VMess URL : $urlVmess"
          Write-Host "Trojan URL: $urlTrojan"


      # ==========================================================
      # GENERATE LINKS
      # ==========================================================

      - name: Generate Worker Links (VMess + Trojan)
        shell: pwsh
        env:
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}

        run: |

          $ErrorActionPreference = "Stop"

          # ======================================================
          # CONFIG
          # ======================================================

          $uuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"
          $serverId = "server1"

          $secret = $env:UPDATE_SECRET

          if ([string]::IsNullOrWhiteSpace($secret)) {
              throw "UPDATE_SECRET secret is empty or missing."
          }


          # ======================================================
          # VMESS
          # ======================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Generating VMess Link"
          Write-Host "=========================================="

          $domainVmess = "my-vpn-worker.hosseinderees7.workers.dev"

          $vmessObj = [ordered]@{
              v    = "2"
              ps   = "WRK_VMess"
              add  = $domainVmess
              port = 443
              id   = $uuid
              aid  = 0
              scy  = "zero"
              net  = "ws"
              type = "none"
              host = ""
              path = "/"
              tls  = "tls"
              sni  = ""
              alpn = ""
              fp   = ""
          }

          $jsonVmess = $vmessObj | ConvertTo-Json -Compress

          $bytesVmess = [System.Text.Encoding]::UTF8.GetBytes(
              $jsonVmess
          )

          $base64Vmess = [System.Convert]::ToBase64String(
              $bytesVmess
          )

          $vmessLink = "vmess://$base64Vmess"

          Write-Host "VMess link generated."


          # ======================================================
          # SEND VMESS
          # ======================================================

          $bodyVmess = @{
              server_id = $serverId
              vmess = $vmessLink
          } | ConvertTo-Json

          try {

              Invoke-RestMethod `
                  -Uri "https://miradig.ir/update" `
                  -Method Post `
                  -Headers @{
                      Authorization = "Bearer $secret"
                  } `
                  -Body $bodyVmess `
                  -ContentType "application/json"

              Write-Host "VMess link sent successfully."

          }
          catch {

              Write-Host "Failed to send VMess link."
              Write-Host $_

              throw
          }

          Write-Host "VMess Link:"
          Write-Host $vmessLink


          # ======================================================
          # TROJAN
          # ======================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Generating Trojan Link"
          Write-Host "=========================================="

          $domainTrojan = "little-frost-5a54.nest-dev-full-stack.workers.dev"

          $trojanLink = "trojan://${uuid}@${domainTrojan}:443?path=%2F&security=tls&type=ws#WRK_Trojan"

          Write-Host "Trojan link generated."


          # ======================================================
          # SEND TROJAN
          # ======================================================

          $bodyTrojan = @{
              server_id = $serverId
              trojan = $trojanLink
          } | ConvertTo-Json

          try {

              Invoke-RestMethod `
                  -Uri "https://miradig.ir/update" `
                  -Method Post `
                  -Headers @{
                      Authorization = "Bearer $secret"
                  } `
                  -Body $bodyTrojan `
                  -ContentType "application/json"

              Write-Host "Trojan link sent successfully."

          }
          catch {

              Write-Host "Failed to send Trojan link."
              Write-Host $_

              throw
          }

          Write-Host "Trojan Link:"
          Write-Host $trojanLink


          # ======================================================
          # FINAL
          # ======================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ALL LINKS SENT SUCCESSFULLY"
          Write-Host "=========================================="