      - name: Update 2 Workers (VMess + Trojan)
        run: |
          # ==========================================
          # ACCOUNT 1: VMess Worker
          # ==========================================
          $vmessToken = "${{ secrets.CF_TOKEN_VMESS }}"
          $vmessAccountId = "e96a2dd0c1de68077e282bab0f5e64af"
          
          # لاگ Cloudflare Tunnel برای VMess (پورت 2053)
          $logVmess = Get-Content "C:\Xray\cf_out_2053.txt", "C:\Xray\cf_err_2053.txt" -Raw -ErrorAction SilentlyContinue
          $urlVmess = $logVmess | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($urlVmess) {
            $workerCodeVmess = @"
      addEventListener('fetch', event => {
        event.respondWith(handleRequest(event.request))
      })
      
      async function handleRequest(request) {
        const url = new URL(request.url);
        const targetUrl = '$urlVmess';
        const newUrl = targetUrl + url.pathname + url.search;
        return fetch(new Request(newUrl, {
          method: request.method,
          headers: request.headers,
          body: request.body
        }));
      }
      "@
            [System.IO.File]::WriteAllText("C:\Xray\worker-vmess.js", $workerCodeVmess)
            
            $response = & curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$vmessAccountId/workers/scripts/vpn-vmess" -H "Authorization: Bearer $vmessToken" -H "Content-Type: application/javascript" --data-binary "@C:\Xray\worker-vmess.js"
            Write-Host "✅ Worker 1 (VMess) updated on account: $vmessAccountId"
          } else {
            Write-Host "❌ VMess URL not found! Check logs."
          }

          # ==========================================
          # ACCOUNT 2: Trojan Worker
          # ==========================================
          $trojanToken = "${{ secrets.CF_TOKEN_TROJAN }}"
          $trojanAccountId = "1d7e90e6cc00cc6ca5494f61cdd3e92d"
          
          # لاگ Cloudflare Tunnel برای Trojan (پورت 2083)
          $logTrojan = Get-Content "C:\Xray\cf_out_2083.txt", "C:\Xray\cf_err_2083.txt" -Raw -ErrorAction SilentlyContinue
          $urlTrojan = $logTrojan | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($urlTrojan) {
            $workerCodeTrojan = @"
      addEventListener('fetch', event => {
        event.respondWith(handleRequest(event.request))
      })
      
      async function handleRequest(request) {
        const url = new URL(request.url);
        const targetUrl = '$urlTrojan';
        const newUrl = targetUrl + url.pathname + url.search;
        return fetch(new Request(newUrl, {
          method: request.method,
          headers: request.headers,
          body: request.body
        }));
      }
      "@
            [System.IO.File]::WriteAllText("C:\Xray\worker-trojan.js", $workerCodeTrojan)
            
            $response = & curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$trojanAccountId/workers/scripts/vpn-trojan" -H "Authorization: Bearer $trojanToken" -H "Content-Type: application/javascript" --data-binary "@C:\Xray\worker-trojan.js"
            Write-Host "✅ Worker 2 (Trojan) updated on account: $trojanAccountId"
          } else {
            Write-Host "❌ Trojan URL not found! Check logs."
          }

      - name: Generate Worker Links (VMess + Trojan)
        run: |
          $uuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"
          $secret = "fasjfajf09wjf9jawfj0j"
          $serverId = "server1"
          
          # ==========================================
          # VMess Link (Worker 1)
          # ==========================================
          $domainVmess = "vpn-vmess.hosseinderees7.workers.dev"  # این رو با دامنه‌ی واقعی ورکرت عوض کن
          $jsonVmess = "{`"add`":`"$domainVmess`",`"aid`":0,`"id`":`"$uuid`",`"net`":`"ws`",`"path`":`"/`",`"port`":443,`"type`":`"none`",`"tls`":`"tls`",`"ps`":`"WRK_VMess`"}"
          $vmessLink = "vmess://" + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($jsonVmess))
          
          # ارسال به هاست
          $body = @{ server_id = $serverId; vmess = $vmessLink } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
            Write-Host "✅ VMess link sent to host"
          } catch {
            Write-Host "❌ Failed to send VMess link: $_"
          }
          
          Write-Host "🔗 VMess Link: $vmessLink"

          # ==========================================
          # Trojan Link (Worker 2)
          # ==========================================
          $domainTrojan = "vpn-trojan.hosseinderees7.workers.dev"  # این رو با دامنه‌ی واقعی ورکرت عوض کن
          $trojanLink = "trojan://${uuid}@${domainTrojan}:443?path=/&security=tls&type=ws#WRK_Trojan"
          
          # ارسال به هاست
          $body = @{ server_id = $serverId; vmess = $trojanLink } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
            Write-Host "✅ Trojan link sent to host"
          } catch {
            Write-Host "❌ Failed to send Trojan link: $_"
          }
          
          Write-Host "🔗 Trojan Link: $trojanLink"
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  ALL WORKERS UPDATED SUCCESSFULLY!" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green