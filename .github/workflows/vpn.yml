      - name: Create Xray Config
        shell: powershell
        run: |
          Set-Location "C:\Xray"

          $uuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"

          # ======================================================
          # VMess - 2053
          # ======================================================

          $vmessInbound = @{
            listen = "0.0.0.0"
            port = 2053
            protocol = "vmess"

            settings = @{
              clients = @(
                @{
                  id = $uuid
                  alterId = 0
                }
              )
            }

            streamSettings = @{
              network = "ws"

              wsSettings = @{
                path = "/"
              }
            }
          }


          # ======================================================
          # Trojan - 2083
          # ======================================================

          $trojanInbound = @{
            listen = "0.0.0.0"
            port = 2083
            protocol = "trojan"

            settings = @{
              clients = @(
                @{
                  password = $uuid
                }
              )
            }

            streamSettings = @{
              network = "ws"

              wsSettings = @{
                path = "/"
              }
            }
          }


          # ======================================================
          # Xray Config
          # ======================================================

          $config = @{
            inbounds = @(
              $vmessInbound
              $trojanInbound
            )

            outbounds = @(
              @{
                protocol = "freedom"
              }
            )

            policy = @{
              levels = @{
                "0" = @{
                  bufferSize = 10240
                }
              }
            }
          }


          # ======================================================
          # WRITE CONFIG
          # ======================================================

          $json = $config | ConvertTo-Json -Depth 20

          [System.IO.File]::WriteAllText(
            "C:\Xray\config.json",
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Xray config created successfully"
          Write-Host "=========================================="

          Write-Host $json