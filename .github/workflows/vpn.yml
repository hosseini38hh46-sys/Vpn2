name: VPN Workers - VMess + Trojan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Install Xray and Cloudflared
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "C:\Xray" -Force | Out-Null
          Set-Location "C:\Xray"

          Invoke-WebRequest `
            -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" `
            -OutFile "xray.zip"

          Expand-Archive `
            -Path "xray.zip" `
            -DestinationPath "C:\Xray" `
            -Force

          Remove-Item "xray.zip" -Force

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile "cloudflared.exe"

          Write-Host "Xray and Cloudflared installed."


      - name: Create Xray Config
        shell: powershell
        run: |
          Set-Location "C:\Xray"

          $vmessUuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"
          $trojanPassword = "1d7e90e6cc00cc6ca5494f61cdd3e92d"

          $vmessInbound = @{
            listen = "0.0.0.0"
            port = 2053
            protocol = "vmess"
            settings = @{
              clients = @(
                @{
                  id = $vmessUuid
                  alterId = 0
                }
              )
            }
            streamSettings = @{
              network = "ws"
              wsSettings = @{
                path = "/"
              }
            }
          }

          $trojanInbound = @{
            listen = "0.0.0.0"
            port = 2083
            protocol = "trojan"
            settings = @{
              clients = @(
                @{
                  password = $trojanPassword
                }
              )
            }
            streamSettings = @{
              network = "ws"
              wsSettings = @{
                path = "/"
              }
            }
          }

          $config = @{
            log = @{
              loglevel = "warning"
            }
            inbounds = @(
              $vmessInbound
              $trojanInbound
            )
            outbounds = @(
              @{
                protocol = "freedom"
              }
            )
          }

          $json = $config | ConvertTo-Json -Depth 20

          [System.IO.File]::WriteAllText(
            "C:\Xray\config.json",
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Xray config created."
          Write-Host $json


      - name: Validate Xray Config
        shell: powershell
        run: |
          & "C:\Xray\xray.exe" run -test -config "C:\Xray\config.json"

          if ($LASTEXITCODE -ne 0) {
            throw "Xray config validation failed."
          }

          Write-Host "Xray config is valid."


      - name: Open Firewall
        shell: powershell
        run: |
          $ports = @(2053, 2083)

          foreach ($port in $ports) {
            netsh advfirewall firewall delete rule name="Xray-$port" | Out-Null

            netsh advfirewall firewall add rule `
              name="Xray-$port" `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$port

            Write-Host "Firewall opened for port $port"
          }


      - name: Start Xray
        shell: powershell
        run: |
          Get-Process -Name "xray" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Process `
            -FilePath "C:\Xray\xray.exe" `
            -ArgumentList "run -config C:\Xray\config.json" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $xray = Get-Process -Name "xray" -ErrorAction SilentlyContinue

          if (-not $xray) {
            throw "Xray failed to start."
          }

          Write-Host "Xray started successfully."


      - name: Start Cloudflared
        shell: powershell
        run: |
          $ports = @(2053, 2083)

          Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          foreach ($port in $ports) {
            Remove-Item "C:\Xray\cf_out_$port.txt" -Force -ErrorAction SilentlyContinue
            Remove-Item "C:\Xray\cf_err_$port.txt" -Force -ErrorAction SilentlyContinue
          }

          foreach ($port in $ports) {
            $command = "C:\Xray\cloudflared.exe tunnel --url http://localhost:$port > C:\Xray\cf_out_$port.txt 2> C:\Xray\cf_err_$port.txt"

            Start-Process `
              -FilePath "cmd.exe" `
              -ArgumentList "/c", $command `
              -WindowStyle Hidden

            Start-Sleep -Seconds 2
          }

          Start-Sleep -Seconds 20

          $cloudflared = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue

          Write-Host "Cloudflared processes: $($cloudflared.Count)"


      - name: Get Cloudflare URLs
        shell: powershell
        run: |
          $logVmess = Get-Content `
            "C:\Xray\cf_out_2053.txt", `
            "C:\Xray\cf_err_2053.txt" `
            -Raw `
            -ErrorAction SilentlyContinue

          $urlVmess = $logVmess |
            Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' |
            ForEach-Object {
              $_.Matches.Value
            } |
            Select-Object -First 1

          if (-not $urlVmess) {
            Write-Host "===== VMess OUT ====="
            Get-Content "C:\Xray\cf_out_2053.txt" -ErrorAction SilentlyContinue

            Write-Host "===== VMess ERR ====="
            Get-Content "C:\Xray\cf_err_2053.txt" -ErrorAction SilentlyContinue

            throw "VMess Cloudflare URL not found."
          }

          $logTrojan = Get-Content `
            "C:\Xray\cf_out_2083.txt", `
            "C:\Xray\cf_err_2083.txt" `
            -Raw `
            -ErrorAction SilentlyContinue

          $urlTrojan = $logTrojan |
            Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' |
            ForEach-Object {
              $_.Matches.Value
            } |
            Select-Object -First 1

          if (-not $urlTrojan) {
            Write-Host "===== Trojan OUT ====="
            Get-Content "C:\Xray\cf_out_2083.txt" -ErrorAction SilentlyContinue

            Write-Host "===== Trojan ERR ====="
            Get-Content "C:\Xray\cf_err_2083.txt" -ErrorAction SilentlyContinue

            throw "Trojan Cloudflare URL not found."
          }

          Write-Host "VMess URL: $urlVmess"
          Write-Host "Trojan URL: $urlTrojan"

          "VMESS_TUNNEL_URL=$urlVmess" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TROJAN_TUNNEL_URL=$urlTrojan" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Update VMess Worker
        shell: powershell
        env:
          CF_TOKEN_VMESS: ${{ secrets.CF_TOKEN_VMESS }}
        run: |
          $accountId = "e96a2dd0c1de68077e282bab0f5e64af"
          $workerName = "my-vpn-worker"
          $token = $env:CF_TOKEN_VMESS
          $targetUrl = $env:VMESS_TUNNEL_URL

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "CF_TOKEN_VMESS is missing."
          }

          if ([string]::IsNullOrWhiteSpace($targetUrl)) {
            throw "VMESS_TUNNEL_URL is missing."
          }

          $workerCode = @(
            "addEventListener('fetch', event => {"
            "  event.respondWith(handleRequest(event.request));"
            "});"
            ""
            "async function handleRequest(request) {"
            "  const url = new URL(request.url);"
            "  const targetUrl = '$targetUrl';"
            "  const newUrl = targetUrl + url.pathname + url.search;"
            ""
            "  return fetch(new Request(newUrl, {"
            "    method: request.method,"
            "    headers: request.headers,"
            "    body: request.body"
            "  }));"
            "}"
          ) -join "`n"

          $headers = @{
            Authorization = "Bearer $token"
            "Content-Type" = "application/javascript"
          }

          $uri = "https://api.cloudflare.com/client/v4/accounts/$accountId/workers/scripts/$workerName"

          Invoke-RestMethod `
            -Uri $uri `
            -Method Put `
            -Headers $headers `
            -Body $workerCode

          Write-Host "VMess Worker updated successfully."


      - name: Update Trojan Worker
        shell: powershell
        env:
          CF_TOKEN_TROJAN: ${{ secrets.CF_TOKEN_TROJAN }}
        run: |
          $accountId = "1d7e90e6cc00cc6ca5494f61cdd3e92d"
          $workerName = "little-frost-5a54"
          $token = $env:CF_TOKEN_TROJAN
          $targetUrl = $env:TROJAN_TUNNEL_URL

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "CF_TOKEN_TROJAN is missing."
          }

          if ([string]::IsNullOrWhiteSpace($targetUrl)) {
            throw "TROJAN_TUNNEL_URL is missing."
          }

          $workerCode = @(
            "addEventListener('fetch', event => {"
            "  event.respondWith(handleRequest(event.request));"
            "});"
            ""
            "async function handleRequest(request) {"
            "  const url = new URL(request.url);"
            "  const targetUrl = '$targetUrl';"
            "  const newUrl = targetUrl + url.pathname + url.search;"
            ""
            "  return fetch(new Request(newUrl, {"
            "    method: request.method,"
            "    headers: request.headers,"
            "    body: request.body"
            "  }));"
            "}"
          ) -join "`n"

          $headers = @{
            Authorization = "Bearer $token"
            "Content-Type" = "application/javascript"
          }

          $uri = "https://api.cloudflare.com/client/v4/accounts/$accountId/workers/scripts/$workerName"

          Invoke-RestMethod `
            -Uri $uri `
            -Method Put `
            -Headers $headers `
            -Body $workerCode

          Write-Host "Trojan Worker updated successfully."


      - name: Generate and Send VMess Link
        shell: powershell
        env:
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
        run: |
          $vmessUuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"
          $serverId = "server1"
          $secret = $env:UPDATE_SECRET
          $domain = "my-vpn-worker.hosseinderees7.workers.dev"

          if ([string]::IsNullOrWhiteSpace($secret)) {
            throw "UPDATE_SECRET is missing."
          }

          $vmessObject = [ordered]@{
            v = "2"
            ps = "WRK_VMess"
            add = $domain
            port = 443
            id = $vmessUuid
            aid = 0
            scy = "zero"
            net = "ws"
            type = "none"
            host = ""
            path = "/"
            tls = "tls"
            sni = ""
            alpn = ""
            fp = ""
          }

          $json = $vmessObject | ConvertTo-Json -Compress
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          $base64 = [System.Convert]::ToBase64String($bytes)
          $link = "vmess://$base64"

          $body = @{
            server_id = $serverId
            vmess = $link
          } | ConvertTo-Json -Compress

          Invoke-RestMethod `
            -Uri "https://miradig.ir/update" `
            -Method Post `
            -Headers @{
              Authorization = "Bearer $secret"
            } `
            -Body $body `
            -ContentType "application/json" `
            -TimeoutSec 15

          Write-Host "VMess link sent successfully."


      - name: Generate and Send Trojan Link
        shell: powershell
        env:
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
        run: |
          $trojanPassword = "1d7e90e6cc00cc6ca5494f61cdd3e92d"
          $serverId = "server1"
          $secret = $env:UPDATE_SECRET
          $domain = "little-frost-5a54.nest-dev-full-stack.workers.dev"

          if ([string]::IsNullOrWhiteSpace($secret)) {
            throw "UPDATE_SECRET is missing."
          }

          $link = "trojan://${trojanPassword}@${domain}:443?path=%2F&security=tls&type=ws#WRK_Trojan"

          $body = @{
            server_id = $serverId
            trojan = $link
          } | ConvertTo-Json -Compress

          Invoke-RestMethod `
            -Uri "https://miradig.ir/update" `
            -Method Post `
            -Headers @{
              Authorization = "Bearer $secret"
            } `
            -Body $body `
            -ContentType "application/json" `
            -TimeoutSec 15

          Write-Host "Trojan link sent successfully."


      - name: Keep Alive
        shell: powershell
        run: |
          $ports = @(2053, 2083)

          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60

            $xray = Get-Process -Name "xray" -ErrorAction SilentlyContinue

            if (-not $xray) {
              Start-Process `
                -FilePath "C:\Xray\xray.exe" `
                -ArgumentList "run -config C:\Xray\config.json" `
                -WindowStyle Hidden

              Write-Host "Xray restarted."
            }

            $cfCount = @(
              Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue
            ).Count

            if ($cfCount -lt $ports.Count) {
              foreach ($port in $ports) {
                $command = "C:\Xray\cloudflared.exe tunnel --url http://localhost:$port > C:\Xray\cf_out_$port.txt 2> C:\Xray\cf_err_$port.txt"

                Start-Process `
                  -FilePath "cmd.exe" `
                  -ArgumentList "/c", $command `
                  -WindowStyle Hidden
              }
            }

            Write-Host "[$i/360] Xray: $(if ($xray) { 'OK' } else { 'Restarted' }) | Cloudflared: $cfCount/$($ports.Count)"
          }