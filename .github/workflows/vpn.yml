- name: Update 2 Workers (VMess + Trojan)
        run: |
          # ==========================================
          # ACCOUNT 1: VMess Worker
          # ==========================================
          $vmessToken = "${{ secrets.CF_TOKEN_VMESS }}"
          $vmessAccountId = "e96a2dd0c1de68077e282bab0f5e64af"
          
          $logVmess = Get-Content "C:\Xray\cf_out_2053.txt", "C:\Xray\cf_err_2053.txt" -Raw -ErrorAction SilentlyContinue
          $urlVmess = $logVmess | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($urlVmess) {
            $workerCodeVmess = @"
      addEventListener('fetch', event => {
        event.respondWith(handleRequest(event.request))
      })
      
      async function handleRequest(request) {
        const url = new URL(request.url);
        const targetUrl = '$urlVmess';
        const newUrl = targetUrl + url.pathname + url.search;
        return fetch(new Request(newUrl, {
          method: request.method,
          headers: request.headers,
          body: request.body
        }));
      }
"@
            $workerCodeVmess | Out-File -FilePath "C:\Xray\worker-vmess.js" -Encoding utf8
            
            $headers = @{
              "Authorization" = "Bearer $vmessToken"
              "Content-Type" = "application/javascript"
            }
            $body = Get-Content "C:\Xray\worker-vmess.js" -Raw
            Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts/$vmessAccountId/workers/scripts/my-vpn-worker" -Method Put -Headers $headers -Body $body
            Write-Host "✅ Worker 1 (VMess) updated on account: $vmessAccountId"
          } else {
            Write-Host "❌ VMess URL not found! Check logs."
          }

          # ==========================================
          # ACCOUNT 2: Trojan Worker
          # ==========================================
          $trojanToken = "${{ secrets.CF_TOKEN_TROJAN }}"
          $trojanAccountId = "1d7e90e6cc00cc6ca5494f61cdd3e92d"
          
          $logTrojan = Get-Content "C:\Xray\cf_out_2083.txt", "C:\Xray\cf_err_2083.txt" -Raw -ErrorAction SilentlyContinue
          $urlTrojan = $logTrojan | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($urlTrojan) {
            $workerCodeTrojan = @"
      addEventListener('fetch', event => {
        event.respondWith(handleRequest(event.request))
      })
      
      async function handleRequest(request) {
        const url = new URL(request.url);
        const targetUrl = '$urlTrojan';
        const newUrl = targetUrl + url.pathname + url.search;
        return fetch(new Request(newUrl, {
          method: request.method,
          headers: request.headers,
          body: request.body
        }));
      }
"@
            $workerCodeTrojan | Out-File -FilePath "C:\Xray\worker-trojan.js" -Encoding utf8
            
            $headers = @{
              "Authorization" = "Bearer $trojanToken"
              "Content-Type" = "application/javascript"
            }
            $body = Get-Content "C:\Xray\worker-trojan.js" -Raw
            Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts/$trojanAccountId/workers/scripts/little-frost-5a54" -Method Put -Headers $headers -Body $body
            Write-Host "✅ Worker 2 (Trojan) updated on account: $trojanAccountId"
          } else {
            Write-Host "❌ Trojan URL not found! Check logs."
          }

      - name: Generate Worker Links (VMess + Trojan)
        run: |
          $uuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"
          $secret = "fasjfajf09wjf9jawfj0j"
          $serverId = "server1"
          
          # VMess Link
          $domainVmess = "my-vpn-worker.hosseinderees7.workers.dev"
          $vmessObj = @{
            v = "2"
            ps = "WRK_VMess"
            add = $domainVmess
            port = 443
            id = $uuid
            aid = 0
            scy = "zero"
            net = "ws"
            type = "none"
            host = ""
            path = "/"
            tls = "tls"
            sni = ""
            alpn = ""
            fp = ""
          }
          $jsonVmess = $vmessObj | ConvertTo-Json -Compress
          $vmessBytes = [System.Text.Encoding]::UTF8.GetBytes($jsonVmess)
          $vmessLink = "vmess://" + [System.Convert]::ToBase64String($vmessBytes)
          
          $bodyVmess = @{ server_id = $serverId; vmess = $vmessLink } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $bodyVmess -ContentType "application/json"
            Write-Host "✅ VMess link sent to host"
          } catch {
            Write-Host "❌ Failed to send VMess link: $_"
          }
          Write-Host "🔗 VMess Link: $vmessLink"
          
          # Trojan Link
          $domainTrojan = "little-frost-5a54.nest-dev-full-stack.workers.dev"
          $trojanLink = "trojan://${uuid}@${domainTrojan}:443?path=%2F&security=tls&type=ws#WRK_Trojan"
          
          $bodyTrojan = @{ server_id = $serverId; trojan = $trojanLink } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $bodyTrojan -ContentType "application/json"
            Write-Host "✅ Trojan link sent to host"
          } catch {
            Write-Host "❌ Failed to send Trojan link: $_"
          }
          Write-Host "🔗 Trojan Link: $trojanLink"