name: AI Model + API + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install llama.cpp and Cloudflared
        run: |
          mkdir -p ai
          cd ai
          # دانلود بیلد آماده llama.cpp (سرور)
          wget -qO llama.tar.gz "https://github.com/ggerganov/llama.cpp/releases/latest/download/llama-bin-ubuntu-x64.zip" || \
          wget -qO llama.tar.gz "https://github.com/ggerganov/llama.cpp/releases/latest/download/llama-server-linux-x64.zip"
          unzip -q llama.tar.gz 2>/dev/null || tar -xzf llama.tar.gz
          chmod +x llama-server 2>/dev/null || chmod +x server 2>/dev/null || true

          wget -qO cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x cloudflared
          echo "✅ Tools installed"
          ls -la

      - name: Download Model (GGUF)
        run: |
          cd ai
          # مدل کوچک مناسب CPU - می‌تونی عوض کنی
          # Qwen2.5-1.5B-Instruct Q4_K_M ~ 1GB
          wget -qO model.gguf "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          ls -lh model.gguf
          echo "✅ Model downloaded"

      - name: Start llama-server (API)
        run: |
          cd ai
          # پورت 8080 برای API
          nohup ./llama-server -m model.gguf --host 127.0.0.1 --port 8080 -c 2048 > llama.log 2>&1 &
          sleep 15
          if pgrep -f "llama-server" > /dev/null; then
            echo "✅ llama-server started"
            curl -s http://127.0.0.1:8080/health || echo "(health check not available)"
          else
            echo "❌ Failed to start llama-server"
            cat llama.log
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        run: |
          cd ai
          nohup ./cloudflared tunnel --url http://127.0.0.1:8080 > cf_out.txt 2> cf_err.txt &
          sleep 20
          echo "--- CF log ---"
          cat cf_err.txt | head -50

      - name: Extract URL and Send
        env:
          SECRET: "fasjfajf09wjf9jawfj0j"
          SERVER_ID: "server5"
        run: |
          cd ai
          # استخراج لینک trycloudflare
          API_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cf_err.txt | head -n 1)
          if [ -z "$API_URL" ]; then
            echo "❌ Could not extract URL"
            cat cf_err.txt
            exit 1
          fi
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "✅ API URL: $API_URL"

          # ارسال به miradig.ir/update (مثل لینک کانفیگ)
          # فرمت: به جای لینک vpn، آدرس API رو می‌فرستیم
          LINK="ai-api://${API_URL}?type=llama&model=qwen2.5-1.5b#AI_API"
          curl -s -X POST "https://miradig.ir/update" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"server_id\":\"$SERVER_ID\",\"vmess\":\"$LINK\"}"

          # یه لینک دوم هم برای دسترسی مستقیم به /v1/chat/completions
          LINK2="${API_URL}/v1/chat/completions"
          curl -s -X POST "https://miradig.ir/update" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"server_id\":\"$SERVER_ID\",\"vmess\":\"$LINK2\"}"

          echo "=========================================="
          echo "✅ API LINK SENT!"
          echo "URL: $API_URL"
          echo "Endpoint: $API_URL/v1/chat/completions"
          echo "=========================================="

      - name: Keep Alive
        run: |
          cd ai
          for i in {1..360}; do
            sleep 60
            if ! pgrep -f "llama-server" > /dev/null; then
              nohup ./llama-server -m model.gguf --host 127.0.0.1 --port 8080 -c 2048 > llama.log 2>&1 &
              sleep 5
              echo "🔄 Restarted llama-server"
            fi
            if ! pgrep -f "cloudflared tunnel" > /dev/null; then
              nohup ./cloudflared tunnel --url http://127.0.0.1:8080 > cf_out.txt 2> cf_err.txt &
              sleep 10
              echo "🔄 Restarted cloudflared"
            fi
            echo "[$i/360] Alive - API: $API_URL"
          done