name: VPN - Tunnel + Worker Custom Domain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Xray and Cloudflared
        run: |
          mkdir -p xray
          cd xray
          wget -qO xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -q xray.zip
          rm xray.zip
          wget -qO cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x xray cloudflared
          echo "Installed"

      - name: Create Xray Config
        run: |
          cd xray
          UUID="5aa2ebe1-5114-4bc3-aefa-935807433e70"
          PASSWORD="5aa2ebe1-5114-4bc3-aefa-935807433e70"

          cat > config.json <<EOF
          {
            "log": {"loglevel": "warning"},
            "inbounds": [
              {"listen": "0.0.0.0", "port": 8080, "protocol": "trojan", "settings": {"clients": [{"password": "${PASSWORD}"}]}, "streamSettings": {"network": "ws", "wsSettings": {"path": "/trojan"}}},
              {"listen": "0.0.0.0", "port": 8081, "protocol": "vless", "settings": {"clients": [{"id": "${UUID}"}], "decryption": "none"}, "streamSettings": {"network": "ws", "wsSettings": {"path": "/vless"}}}
            ],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF

      - name: Start Xray
        run: |
          cd xray
          ./xray run -config config.json > xray.log 2>&1 &
          sleep 5

      - name: Start Cloudflared 1 (Trojan)
        run: |
          cd xray
          ./cloudflared tunnel --url http://127.0.0.1:8080 > cf1.txt 2> cf1_err.txt &
          sleep 15

      - name: Start Cloudflared 2 (VLESS)
        run: |
          cd xray
          ./cloudflared tunnel --url http://127.0.0.1:8081 > cf2.txt 2> cf2_err.txt &
          sleep 15

      - name: Get URLs
        run: |
          cd xray
          TROJAN_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cf1_err.txt | head -n 1)
          VLESS_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cf2_err.txt | head -n 1)
          
          echo "TROJAN_URL=$TROJAN_URL" >> $GITHUB_ENV
          echo "VLESS_URL=$VLESS_URL" >> $GITHUB_ENV

      - name: Update Worker
        env:
          CF_TOKEN_TROJAN: ${{ secrets.CF_TOKEN_TROJAN}}
        run: |
          cd xray
          
          WORKER_CODE=$(cat <<EOF
          addEventListener('fetch', event => {
            event.respondWith(handleRequest(event.request));
          });

          async function handleRequest(request) {
            const url = new URL(request.url);
            
            const trojanUrl = "${TROJAN_URL}";
            const vlessUrl = "${VLESS_URL}";
            
            let target = trojanUrl;
            
            if (url.pathname.startsWith('/vless')) {
              target = vlessUrl;
              url.pathname = url.pathname.replace('/vless', '/');
            }
            
            const newUrl = target + url.pathname + url.search;
            
            return fetch(new Request(newUrl, {
              method: request.method,
              headers: request.headers,
              body: request.body
            }));
          }
          EOF
          )
          
          ACC_ID="e96a2dd0c1de68077e282bab0f5e64af"
          
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${ACC_ID}/workers/scripts/my-vpn-worker" \
            -H "Authorization: Bearer $CF_TOKEN_TROJAN" \
            -H "Content-Type: application/javascript" \
            --data-raw "$WORKER_CODE"
          
          echo "Worker updated"

      - name: Generate Links
        run: |
          UUID="5aa2ebe1-5114-4bc3-aefa-935807433e70"
          PASSWORD="5aa2ebe1-5114-4bc3-aefa-935807433e70"
          SERVER_ID="server1"
          SECRET="fasjfajf09wjf9jawfj0j"
          WORKER_DOMAIN="asdoijaosd.taban-learn.ir"
          
          TROJAN_DOMAIN=$(echo "$TROJAN_URL" | sed 's|https://||')
          VLESS_DOMAIN=$(echo "$VLESS_URL" | sed 's|https://||')
          
          # 4 Links
          TROJAN_TUNNEL="trojan://${PASSWORD}@${TROJAN_DOMAIN}:443?path=%2Ftrojan&security=tls&type=ws#Trojan_Tunnel"
          VLESS_TUNNEL="vless://${UUID}@${VLESS_DOMAIN}:443?path=%2Fvless&security=tls&encryption=none&type=ws#VLESS_Tunnel"
          TROJAN_WORKER="trojan://${PASSWORD}@${WORKER_DOMAIN}:443?path=/&security=tls&type=ws#Trojan_Worker"
          VLESS_WORKER="vless://${UUID}@${WORKER_DOMAIN}:443?path=%2Fvless&security=tls&encryption=none&type=ws#VLESS_Worker"
          
          for LINK in "$TROJAN_TUNNEL" "$VLESS_TUNNEL" "$TROJAN_WORKER" "$VLESS_WORKER"; do
            curl -s -X POST "https://miradig.ir/update" \
              -H "Authorization: Bearer $SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"server_id\":\"$SERVER_ID\",\"vmess\":\"$LINK\"}"
          done
          
          echo "All sent!"

      - name: Keep Alive
        run: |
          cd xray
          for i in {1..360}; do
            sleep 60
            if ! pgrep -f "xray run" > /dev/null; then
              ./xray run -config config.json > xray.log 2>&1 &
            fi
            if ! pgrep -f "cloudflared tunnel" > /dev/null; then
              ./cloudflared tunnel --url http://127.0.0.1:8080 > cf1.txt 2> cf1_err.txt &
              ./cloudflared tunnel --url http://127.0.0.1:8081 > cf2.txt 2> cf2_err.txt &
            fi
            echo "[$i/360] Alive"
          done