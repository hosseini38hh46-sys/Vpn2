name: AI Model + API + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip wget curl
          mkdir -p ai
          cd ai

          # دانلود llama.cpp build (لینک اصلاح‌شده)
          wget -q "https://github.com/ggml-org/llama.cpp/releases/latest/download/llama-b-linux-x64.zip" -O llama.zip || \
          wget -q "https://github.com/ggerganov/llama.cpp/releases/latest/download/llama-b-linux-x64.zip" -O llama.zip

          unzip -q llama.zip
          # باینری ممکنه داخل زیرپوشه باشه
          find . -name "llama-server" -type f -exec cp {} ./llama-server \; 2>/dev/null || true
          chmod +x llama-server 2>/dev/null || true

          # cloudflared
          wget -q "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" -O cloudflared
          chmod +x cloudflared

          echo "=== Files in ai/ ==="
          ls -la
          echo "=== llama-server check ==="
          ./llama-server --version || echo "llama-server failed to run"

      - name: Download Model
        run: |
          cd ai
          # مدل کوچک و مطمئن
          wget -q "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true" -O model.gguf
          ls -lh model.gguf
          file model.gguf

      - name: Start llama-server
        run: |
          cd ai
          nohup ./llama-server -m model.gguf --host 127.0.0.1 --port 8080 -c 2048 -t 2 > llama.log 2>&1 &
          echo "Waiting for server..."
          for i in {1..30}; do
            sleep 3
            if curl -s http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "✅ Server is up after $((i*3))s"
              curl -s http://127.0.0.1:8080/health
              exit 0
            fi
          done
          echo "❌ Server failed to start. Log:"
          cat llama.log
          exit 1

      - name: Start Cloudflare Tunnel
        run: |
          cd ai
          nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cf_out.txt 2> cf_err.txt &
          echo "Waiting for tunnel URL..."
          for i in {1..20}; do
            sleep 3
            if grep -q "trycloudflare.com" cf_err.txt 2>/dev/null; then
              echo "✅ Tunnel ready"
              break
            fi
          done
          cat cf_err.txt | head -30

      - name: Extract URL and Send
        env:
          SECRET: "fasjfajf09wjf9jawfj0j"
          SERVER_ID: "server5"
        run: |
          cd ai
          API_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cf_err.txt | head -n 1)
          if [ -z "$API_URL" ]; then
            echo "❌ No URL found in cf_err.txt"
            cat cf_err.txt
            exit 1
          fi
          echo "✅ API URL: $API_URL"

          # تست واقعی API
          echo "Testing API..."
          curl -s -X POST "${API_URL}/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"hi"}],"max_tokens":10}' \
            --max-time 60 || echo "API test failed (may still work)"

          # ارسال به سرورت
          LINK="ai-api://${API_URL}#AI_API"
          curl -s -X POST "https://miradig.ir/update" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"server_id\":\"$SERVER_ID\",\"vmess\":\"$LINK\"}" || echo "POST failed"

          echo "=========================================="
          echo "✅ DONE"
          echo "URL: $API_URL"
          echo "Chat endpoint: $API_URL/v1/chat/completions"
          echo "=========================================="

      - name: Keep Alive
        run: |
          cd ai
          for i in {1..350}; do
            sleep 60
            if ! pgrep -f "llama-server" > /dev/null; then
              nohup ./llama-server -m model.gguf --host 127.0.0.1 --port 8080 -c 2048 -t 2 > llama.log 2>&1 &
              echo "🔄 Restarted llama-server"
            fi
            if ! pgrep -f "cloudflared tunnel" > /dev/null; then
              nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cf_out.txt 2> cf_err.txt &
              echo "🔄 Restarted cloudflared"
              sleep 15
            fi
            echo "[$i/350] Alive"
          done